{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-12">
    <div class="card text-center" style="max-width: 600px; margin: 0 auto; padding: var(--space-12);">
        <div style="font-size: 6rem; margin-bottom: var(--space-4);">404</div>
        <h1 class="mb-4">Page Not Found</h1>
        <p class="text-gray mb-8">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
    </div>
</div>
{% endblock %}
