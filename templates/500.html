{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container py-12">
    <div class="card text-center" style="max-width: 600px; margin: 0 auto; padding: var(--space-12);">
        <div style="font-size: 6rem; margin-bottom: var(--space-4);">500</div>
        <h1 class="mb-4">Internal Server Error</h1>
        <p class="text-gray mb-8">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
    </div>
</div>
{% endblock %}
