{% extends "base.html" %}

{% block title %}Edit Voter - Admin{% endblock %}

{% block content %}
<div class="container-sm py-6">
    <div class="card-glass" style="max-width: 600px; margin: 0 auto; padding: var(--space-8);">
        <h1 class="h2 mb-6">Edit Voter</h1>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ voter.name }}" required>
            </div>

            <div class="form-group">
                <label for="cnic" class="form-label">CNIC Number</label>
                <input type="text" class="form-control" value="{{ voter.cnic|format_cnic }}" disabled>
                <p class="text-sm text-gray mt-1">ℹ️ CNIC cannot be changed for security reasons</p>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ voter.email }}" required>
            </div>

            <hr class="my-4">

            <div class="form-group">
                <label for="new_password" class="form-label">Reset Password (Optional)</label>
                <input type="password" id="new_password" name="new_password" class="form-control"
                    placeholder="Leave blank to keep current password" minlength="6">
                <p class="text-sm text-warning mt-1">⚠️ Use this if voter forgot password or account was compromised</p>
            </div>

            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-primary">Update Voter</button>
                <a href="{{ url_for('admin.manage_voters') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
