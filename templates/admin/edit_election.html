{% extends "base.html" %}

{% block title %}Edit {{ election.title }} - Online Voting System{% endblock %}

{% block content %}
<div class="container-sm py-8">
    <div class="card" style="padding: var(--space-10);">
        <div class="mb-8">
            <h1 style="margin-bottom: var(--space-2);">Edit Election</h1>
            <p class="text-gray">Update election details and schedule</p>
        </div>

        <form method="POST" action="{{ url_for('admin.edit_election', election_id=election.election_id) }}">
            <div class="form-group">
                <label for="title" class="form-label">Election Title</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ election.title }}" required>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" name="description" class="form-control"
                    rows="4">{{ election.description or '' }}</textarea>
            </div>

            <div class="grid grid-2">
                <div class="form-group">
                    <label for="start_date" class="form-label">Start Date & Time</label>
                    <input type="datetime-local" id="start_date" name="start_date" class="form-control"
                        value="{{ election.start_date.strftime('%Y-%m-%dT%H:%M') }}" required>
                </div>

                <div class="form-group">
                    <label for="end_date" class="form-label">End Date & Time</label>
                    <input type="datetime-local" id="end_date" name="end_date" class="form-control"
                        value="{{ election.end_date.strftime('%Y-%m-%dT%H:%M') }}" required>
                </div>
            </div>

            <div
                style="display: flex; gap: var(--space-4); justify-content: space-between; margin-top: var(--space-8);">
                <form method="POST" action="{{ url_for('admin.delete_election', election_id=election.election_id) }}"
                    style="margin: 0;" onsubmit="return confirmDelete('{{ election.title }}')">
                    <button type="submit" class="btn btn-danger">Delete Election</button>
                </form>

                <div style="display: flex; gap: var(--space-4);">
                    <a href="{{ url_for('admin.elections') }}" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
